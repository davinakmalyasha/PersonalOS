name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/api/go.sum
      - name: Install gcc (for mattn/go-sqlite3)
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test ./... -count=1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install deps
        run: npm ci --prefix apps/web
      - name: Lint
        run: npm --prefix apps/web run lint
      - name: Typecheck
        run: npx --prefix apps/web tsc --noEmit
      - name: Build (webpack)
        run: npm --prefix apps/web run build
