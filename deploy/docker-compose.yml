name: personal-os

services:
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    environment:
      # Set to require bearer auth; MCP + dashboards must then send it.
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      - dbdata:/data
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    # The dashboard calls the API from the BROWSER, so this must be a URL the
    # host can reach (baked at build time). Default matches the published port.
    args:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  scheduler:
    build:
      context: ../services/scheduler
      dockerfile: Dockerfile
    environment:
      API_URL: http://api:8080
      API_TOKEN: ${API_TOKEN:-}
      SCHED_INTERVAL_SECONDS: ${SCHED_INTERVAL_SECONDS:-21600}
      SCHED_RUN_HOUR: ${SCHED_RUN_HOUR:-2}
      SCHED_RUN_ON_START: ${SCHED_RUN_ON_START:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dbdata:
